name: Build OptimizarPC

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PS2EXE
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force

      - name: Build EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Invoke-ps2exe -InputFile src/OptimizarPC.ps1 -OutputFile dist/OptimizarPC.exe -NoConsole -Title "OptimizarPC" -Description "OptimizarPC - Diagnostico y mantenimiento de Windows" -Company "Yakoderaa" -Product "OptimizarPC" -Version "1.0.0"

      - name: Package
        shell: powershell
        run: |
          Copy-Item Launch-PC-Optimizer.cmd dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath OptimizarPC-1.0.0.zip -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptimizarPC-1.0.0
          path: |
            dist/OptimizarPC.exe
            OptimizarPC-1.0.0.zip
